<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King Living — Kiosk</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #1a1a1a;
    color: #f5f5f5;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px;
    background:
      radial-gradient(circle at 20% 30%, rgba(180, 140, 90, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(120, 100, 80, 0.06) 0%, transparent 50%),
      #1a1a1a;
  }

  .header {
    text-align: center;
    margin-bottom: 60px;
  }

  .brand {
    font-size: 42px;
    font-weight: 300;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #ffffff;
    margin-bottom: 12px;
  }

  .subtitle {
    font-size: 16px;
    font-weight: 300;
    letter-spacing: 2px;
    color: #a0a0a0;
    text-transform: uppercase;
  }

  .tiles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
    max-width: 1200px;
    width: 100%;
  }

  .tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 32px;
    min-height: 280px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 4px;
    text-decoration: none;
    color: #ffffff;
    transition: all 0.25s ease;
    cursor: pointer;
  }

  .tile:hover, .tile:focus {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(180, 140, 90, 0.5);
    transform: translateY(-2px);
    outline: none;
  }

  .tile:active {
    transform: translateY(0);
    background: rgba(180, 140, 90, 0.15);
  }

  .tile-icon {
    width: 56px;
    height: 56px;
    margin-bottom: 24px;
    opacity: 0.85;
  }

  .tile-title {
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .tile-desc {
    font-size: 14px;
    font-weight: 300;
    color: #a0a0a0;
    line-height: 1.5;
  }

  .tile-manual {
    cursor: default;
    padding: 36px 28px;
    justify-content: flex-start;
  }

  .tile-manual:hover {
    transform: none;
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(255, 255, 255, 0.08);
  }

  .tile-manual .tile-icon { margin-bottom: 16px; width: 44px; height: 44px; }
  .tile-manual .tile-title { font-size: 18px; margin-bottom: 8px; }
  .tile-manual .tile-desc { font-size: 13px; margin-bottom: 20px; }

  .url-input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 3px;
    color: #ffffff;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    margin-bottom: 12px;
    transition: border-color 0.2s ease;
  }

  .url-input:focus {
    border-color: rgba(180, 140, 90, 0.6);
  }

  .url-input::placeholder {
    color: #707070;
  }

  .go-btn {
    width: 100%;
    padding: 12px;
    background: rgba(180, 140, 90, 0.2);
    border: 1px solid rgba(180, 140, 90, 0.4);
    border-radius: 3px;
    color: #ffffff;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
  }

  .go-btn:hover {
    background: rgba(180, 140, 90, 0.3);
    border-color: rgba(180, 140, 90, 0.6);
  }

  .go-btn:active {
    background: rgba(180, 140, 90, 0.4);
  }

  .footer {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: #606060;
    letter-spacing: 1px;
  }

  .clock {
    position: fixed;
    top: 24px;
    right: 32px;
    font-size: 14px;
    color: #808080;
    font-weight: 300;
    letter-spacing: 1px;
  }

  @media (max-width: 900px) {
    .tiles {
      grid-template-columns: 1fr;
      gap: 20px;
    }
    .brand { font-size: 32px; letter-spacing: 6px; }
    .tile { min-height: 180px; padding: 40px 24px; }
    .tile-manual { padding: 28px 24px; }
  }
</style>
</head>
<body>

  <div class="clock" id="clock">—</div>

  <div class="header">
    <div class="brand">King Living</div>
    <div class="subtitle">Quick Access</div>
  </div>

  <div class="tiles">

    <!-- TILE 1 — SAP AU Portal -->
    <a href="https://portal.kingliving.com.au/" class="tile">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="4" width="18" height="14" rx="1"/>
        <path d="M3 9h18"/>
        <path d="M8 14h4"/>
      </svg>
      <div class="tile-title">SAP AU Portal</div>
      <div class="tile-desc">SAP AU portal</div>
    </a>

    <!-- TILE 2 — WMS AU Portal -->
    <a href="https://wms.kingliving.com.au/login/" class="tile">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M3 7l9-4 9 4-9 4-9-4z"/>
        <path d="M3 12l9 4 9-4"/>
        <path d="M3 17l9 4 9-4"/>
      </svg>
      <div class="tile-title">WMS AU Portal</div>
      <div class="tile-desc">Warehouse Management</div>
    </a>

    <!-- TILE 3 — Manual URL entry -->
    <div class="tile tile-manual">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18"/>
        <path d="M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>
      </svg>
      <div class="tile-title">Other Portals</div>
      <div class="tile-desc">Manually type a URL</div>

      <input type="text" id="manualUrl" class="url-input"
             placeholder="e.g. portal.kingliving.com"
             autocomplete="off" spellcheck="false">
      <button class="go-btn" onclick="goToUrl()">Go</button>
    </div>

  </div>

  <div class="footer">
    King Living &middot; Any error contact helpdesk@kingliving.com
  </div>

<script>
  function tick() {
    const now = new Date();
    const opts = { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' };
    document.getElementById('clock').textContent = now.toLocaleString('en-AU', opts);
  }
  tick();
  setInterval(tick, 30000);

  function goToUrl() {
    let url = document.getElementById('manualUrl').value.trim();
    if (!url) return;
    if (!url.match(/^https?:\/\//i)) {
      url = 'https://' + url;
    }
    window.location.href = url;
  }

  document.getElementById('manualUrl').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') goToUrl();
  });
</script>

</body>
</html>
